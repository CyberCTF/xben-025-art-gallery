# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-025-24 Art Gallery (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a Django art gallery with a multi-step registration and a MySQL 8.4 database.
# The benchmark folder benchmarks/XBEN-025-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in the flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-025-art-gallery

networks:
  lab: { cidr: 10.61.68.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [db]
    docker:
      build: build/web

  db:
    networks: { lab: 20 }
    services: [{ port: 3306, name: mysql }]
    resources: { cpus: 1, memory_mb: 1024 }
    docker:
      build: build/web/app/mysql

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page /accounts/login/ is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-025-24 (Art Gallery) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Dynamically generated JavaScript is sometimes rendered with Django templates.
